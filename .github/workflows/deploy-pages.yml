name: Deploy portal previews to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm install
      - name: Type-check all portals
        run: npm run typecheck
      - name: Build all portals
        run: npm run build
      - name: Assemble preview site
        shell: bash
        run: |
          mkdir -p _site
          for portal in founder admin instructor student institution; do
            mkdir -p "_site/$portal"
            cp -R "apps/$portal/dist/." "_site/$portal/"
          done
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="theme-color" content="#f6f8fc">
            <title>Spark Stack Academy | Portal Preview</title>
            <style>
              *{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#172033;font:16px/1.5 Inter,system-ui,sans-serif}
              main{max-width:980px;margin:0 auto;padding:64px 24px}p{color:#64748b}
              .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#5265c7}
              h1{font-size:clamp(32px,6vw,52px);line-height:1.08;margin:12px 0}
              .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:36px}
              a{display:block;padding:22px;border:1px solid #e1e7f0;border-radius:16px;background:white;color:inherit;text-decoration:none;font-weight:700}
              a:hover{border-color:#7c8be8;transform:translateY(-2px)}small{display:block;margin-top:8px;color:#64748b;font-weight:400}
              footer{margin-top:40px;color:#64748b;font-size:13px}
            </style>
          </head>
          <body><main>
            <div class="eyebrow">Spark Stack International Tech Firm</div>
            <h1>Spark Stack Academy</h1>
            <p>Preview the five portal foundations. These are visual and navigation previews, not production-ready workflows.</p>
            <section class="grid">
              <a href="./founder/">Founder Portal<small>Executive overview and platform controls</small></a>
              <a href="./admin/">Admin Portal<small>Platform administration workspace</small></a>
              <a href="./instructor/">Instructor Portal<small>Teaching and course workspace</small></a>
              <a href="./student/">Student Portal<small>Learning workspace</small></a>
              <a href="./institution/">Institution Portal<small>Institution management workspace</small></a>
            </section>
            <footer>Preview deployment · No production Firebase or payment services connected</footer>
          </main></body></html>
          HTML
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
