name: Validate workspace

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "foundation/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Type-check all portal applications
        run: npm run typecheck
      - name: Build all portal applications
        run: npm run build
